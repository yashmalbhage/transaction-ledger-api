services:
  db:
    image: mysql:8
    container_name: ledger-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ledger
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger
    # Allows the non-root app user to create the immutability triggers while binary logging is on.
    command: ["--log-bin-trust-function-creators=1"]
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - ledger-mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uledger", "-pledger"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: ledger-api
    profiles: ["full"]
    environment:
      DATABASE_URL: mysql+pymysql://ledger:ledger@db:3306/ledger
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ledger-mysql-data:
